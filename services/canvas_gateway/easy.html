<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一键出片</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
    --accent: #d2452f; --accent-ink: #ffffff; --ok: #2f8a4c; --bad: #c0362c; --soft: #f1efea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --card: #212124; --ink: #f2f2f3; --muted: #a1a1a8; --line: #34343a;
            --accent: #ef6a52; --accent-ink: #111; --ok: #5cc27e; --bad: #f07466; --soft: #2a2a2e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.55 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 28px; margin: 0; }
  header a { color: var(--muted); font-size: 15px; }
  .sub { color: var(--muted); margin: 4px 0 20px; }
  .modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .mode { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 16px 14px;
          text-align: left; cursor: pointer; color: var(--ink); font: inherit; }
  .mode:hover { border-color: var(--muted); }
  .mode.on { border-color: var(--accent); }
  .mode .icon { font-size: 30px; display: block; }
  .mode b { font-size: 19px; display: block; margin-top: 4px; }
  .mode small { color: var(--muted); font-size: 13px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
         margin-top: 18px; display: none; }
  form.on { display: block; }
  .hint { color: var(--muted); margin: 0 0 14px; }
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field .opt { color: var(--muted); font-weight: 400; font-size: 14px; }
  textarea, input[type=number], select { width: 100%; font: inherit; color: var(--ink); background: var(--soft);
         border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 90px; resize: vertical; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer;
          background: var(--soft); color: var(--muted); }
  .drop.has { border-style: solid; border-color: var(--ok); color: var(--ink); }
  .drop img, .drop video { max-width: 100%; max-height: 220px; border-radius: 8px; display: block; margin: 0 auto 6px; }
  .drop audio { width: 100%; margin-bottom: 6px; }
  .drop input { display: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .tabs button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
                 background: var(--soft); color: var(--ink); cursor: pointer; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .go { font: inherit; font-size: 20px; font-weight: 700; width: 100%; padding: 14px; border: 0; border-radius: 12px;
        background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .go:disabled { opacity: .5; cursor: wait; }
  .msg { margin-top: 10px; min-height: 1.5em; }
  .msg.bad { color: var(--bad); }
  h2 { font-size: 21px; margin: 32px 0 10px; }
  .jobs { display: grid; gap: 12px; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .job .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .job .name { font-weight: 600; }
  .job .state { font-size: 15px; }
  .job .state.completed { color: var(--ok); }
  .job .state.failed { color: var(--bad); }
  .job .prompt { color: var(--muted); font-size: 14px; margin: 4px 0; overflow-wrap: anywhere; }
  .job .err { color: var(--bad); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .job video, .job img { max-width: 100%; max-height: 420px; border-radius: 10px; display: block; margin-top: 8px; }
  .job audio { width: 100%; margin-top: 8px; }
  .job a.dl { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 600; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>一键出片</h1>
    <a href="/">高级：无限画布 →</a>
  </header>
  <p class="sub">选一个功能，放进素材，点「开始」。全部在本机显卡上跑，不花钱。可以关掉页面，回来在下面的记录里取结果。</p>

  <div class="modes" id="modes"></div>
  <form id="form" autocomplete="off"></form>

  <h2>最近的任务</h2>
  <div class="jobs" id="jobs"><p class="empty">还没有任务。</p></div>
</main>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let MODES = [], VOICES = [], DEFAULT_VOICE = null, current = null;
const files = {};          // field key -> File
const ACCEPT = {image: "image/*", audio: "audio/*", video: "video/*"};
const STATE = {queued: "排队中", in_progress: "生成中", completed: "完成", failed: "失败"};

async function load() {
  const r = await fetch("/easy/modes");
  const data = await r.json();
  MODES = data.modes; VOICES = data.voices; DEFAULT_VOICE = data.default_voice;
  const box = $("#modes");
  if (!MODES.length) { box.innerHTML = '<p class="empty">配置文件里还没有给模型加 "easy" 设置。</p>'; return; }
  box.innerHTML = MODES.map((m, i) =>
    `<button class="mode" data-i="${i}"><span class="icon">${esc(m.icon || "▶")}</span><b>${esc(m.button)}</b>` +
    `<small>${esc(m.minutes ? "约 " + m.minutes + " 分钟" : "")}</small></button>`).join("");
  box.querySelectorAll(".mode").forEach(b => b.onclick = () => pick(+b.dataset.i));
  try { const last = localStorage.getItem("easy-mode"); const i = MODES.findIndex(m => m.model === last); if (i >= 0) pick(i); } catch (e) {}
}

function pick(i) {
  current = MODES[i];
  try { localStorage.setItem("easy-mode", current.model); } catch (e) {}
  document.querySelectorAll(".mode").forEach(b => b.classList.toggle("on", +b.dataset.i === i));
  for (const k in files) delete files[k];
  const form = $("#form");
  form.className = "on";
  form.innerHTML = (current.hint ? `<p class="hint">${esc(current.hint)}</p>` : "") +
    current.fields.map((f, n) => fieldHtml(f, n)).join("") +
    (current.sizes.length ? sizeHtml(current.sizes) : "") +
    `<button class="go" type="submit">开始</button><div class="msg" id="msg"></div>`;
  form.querySelectorAll(".drop").forEach(wireDrop);
  form.querySelectorAll(".tabs").forEach(t => t.querySelectorAll("button").forEach(b => b.onclick = () => {
    t.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    const wrap = t.parentElement;
    wrap.querySelectorAll("[data-pane]").forEach(p => p.hidden = p.dataset.pane !== b.dataset.tab);
  }));
}

function label(f, fallback) {
  return `<label>${esc(f.label || fallback)}${f.optional ? ' <span class="opt">（可不填）</span>' : ""}</label>`;
}

function dropHtml(key, type, text) {
  return `<div class="drop" data-key="${key}" data-type="${type}"><input type="file" accept="${ACCEPT[type]}">` +
         `<div class="preview"></div><span>${esc(text)}</span></div>`;
}

function fieldHtml(f, n) {
  const key = "f" + n;
  if (f.type === "image" || f.type === "audio" || f.type === "video") {
    const word = {image: "图片", audio: "音频", video: "视频"}[f.type];
    return `<div class="field">${label(f, word)}${dropHtml(key, f.type, `点这里选${word}，或把文件拖进来`)}</div>`;
  }
  if (f.type === "speech") {
    const opts = VOICES.map(v => `<option value="${esc(v.model)}"${v.model === DEFAULT_VOICE ? " selected" : ""}>${esc(v.label)}</option>`).join("");
    return `<div class="field">${label(f, "声音")}
      <div class="tabs"><button type="button" class="on" data-tab="file">我有录音</button>` +
      (VOICES.length ? `<button type="button" data-tab="text">输入文字自动配音</button>` : "") + `</div>
      <div data-pane="file">${dropHtml(key, "audio", "点这里选录音（mp3 / wav），或拖进来")}</div>
      <div data-pane="text" hidden><textarea name="speech_text" placeholder="把要说的话写在这里"></textarea>
        <div style="margin-top:8px"><select name="voice">${opts}</select></div></div></div>`;
  }
  if (f.type === "prompt") {
    return `<div class="field">${label(f, "描述")}<textarea name="prompt" placeholder="${esc(f.placeholder || "")}"></textarea></div>`;
  }
  if (f.type === "seconds") {
    return `<div class="field">${label(f, "时长（秒）")}<input type="number" name="seconds" min="1" max="${f.max || 15}" step="1" value="${f.default || 5}"></div>`;
  }
  return "";
}

function sizeHtml(sizes) {
  const opts = sizes.map(s => typeof s === "string" ? {value: s, label: s} : s)
    .map(s => `<option value="${esc(s.value)}">${esc(s.label)}</option>`).join("");
  return `<div class="field"><label>画面</label><select name="size">${opts}</select></div>`;
}

function wireDrop(el) {
  const input = $("input", el);
  const set = file => {
    if (!file) return;
    files[el.dataset.key] = {file, type: el.dataset.type};
    el.classList.add("has");
    const url = URL.createObjectURL(file);
    const tag = {image: `<img src="${url}">`, video: `<video src="${url}" muted controls></video>`,
                 audio: `<audio src="${url}" controls></audio>`}[el.dataset.type];
    $(".preview", el).innerHTML = tag;
    $("span", el).textContent = file.name + "（点这里换一个）";
  };
  el.onclick = e => { if (!["VIDEO", "AUDIO"].includes(e.target.tagName)) input.click(); };
  input.onchange = () => set(input.files[0]);
  el.ondragover = e => { e.preventDefault(); };
  el.ondrop = e => { e.preventDefault(); set(e.dataTransfer.files[0]); };
}

$("#form").onsubmit = async e => {
  e.preventDefault();
  const form = e.target, msg = $("#msg"), btn = $(".go", form);
  msg.className = "msg"; msg.textContent = "";
  const body = new FormData();
  body.append("model", current.model);
  for (const n of ["prompt", "seconds", "size"]) { const el = form.elements[n]; if (el && el.value) body.append(n, el.value); }
  const textPane = $('[data-pane="text"]', form);
  const useText = textPane && !textPane.hidden;
  for (const [n, f] of current.fields.entries()) {
    const picked = files["f" + n];
    if (f.type === "speech" && useText) {
      const text = form.elements.speech_text.value.trim();
      if (!text) return fail("请写上要说的话。");
      body.append("speech_text", text); body.append("voice", form.elements.voice.value);
      continue;
    }
    if (["image", "audio", "video", "speech"].includes(f.type)) {
      if (!picked) { if (f.optional) continue; return fail(`请先放进「${f.label || "素材"}」。`); }
      body.append(picked.type, picked.file, picked.file.name);
    }
    if (f.type === "prompt" && !f.optional && !form.elements.prompt.value.trim()) return fail(`请填写「${f.label || "描述"}」。`);
  }
  btn.disabled = true; btn.textContent = "提交中…";
  try {
    const r = await fetch("/easy/run", {method: "POST", body});
    const data = await r.json().catch(() => ({}));
    if (!r.ok) return fail(data.detail || "提交失败");
    msg.textContent = "已经开始了，进度看下面的记录。";
    refresh();
  } catch (err) { fail("连不上网关，确认「启动画布」窗口还开着。"); }
  finally { btn.disabled = false; btn.textContent = "开始"; }
  function fail(t) { msg.className = "msg bad"; msg.textContent = t; }
};

async function refresh() {
  let data;
  try { data = (await (await fetch("/v1/jobs?limit=20")).json()).data; } catch (e) { return; }
  const box = $("#jobs");
  if (!data.length) return;
  const names = Object.fromEntries(MODES.map(m => [m.model, m.button]).concat(VOICES.map(v => [v.model, "配音 · " + v.label])));
  const html = data.map(j => {
    let state = STATE[j.status] || j.status;
    if (j.status === "queued" && j.queue_position) state += `（前面还有 ${j.queue_position - 1} 个）`;
    if (j.seconds_spent != null) state += ` · ${fmt(j.seconds_spent)}`;
    let media = "";
    if (j.file) {
      if (j.file_type.startsWith("video")) media = `<video src="${j.file}" controls preload="metadata"></video>`;
      else if (j.file_type.startsWith("image")) media = `<img src="${j.file}">`;
      else if (j.file_type.startsWith("audio")) media = `<audio src="${j.file}" controls></audio>`;
      media += `<a class="dl" href="${j.file}?download=true">下载</a>`;
    }
    return `<div class="job"><div class="top"><span class="name">${esc(names[j.model] || j.model)}</span>` +
      `<span class="state ${j.status}">${esc(state)}</span></div>` +
      (j.prompt ? `<div class="prompt">${esc(j.prompt)}</div>` : "") +
      (j.error ? `<div class="err">${esc(j.error.message)}</div>` : "") + media + `</div>`;
  });
  // Rebuild only when something changed, so a video that is playing keeps playing.
  const next = html.join("");
  if (box.dataset.html !== next) {
    const playing = [...box.querySelectorAll("video,audio")].some(m => !m.paused);
    if (!playing) { box.innerHTML = next; box.dataset.html = next; }
  }
}
function fmt(s) { return s < 60 ? `${s} 秒` : `${Math.floor(s / 60)} 分 ${s % 60} 秒`; }

load().then(refresh);
setInterval(refresh, 4000);
</script>
</body>
</html>
